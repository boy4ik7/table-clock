[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
upload_port = COM3
lib_deps = 
	gyverlibs/GTimer@^1.1.4
	gyverlibs/EncButton@^3.7.6
	gyverlibs/Settings@^1.4.3
	gyverlibs/GTL@^1.4.7
	gyverlibs/GyverDB@^1.4.4
	gyverlibs/StringUtils@^1.6.1
	gyverlibs/BSON@^3.0.1
	gyverlibs/Stamp@^1.5.1
	gyverlibs/Table@^1.3.6
	gyverlibs/StreamIO@^1.0.5
	gyverlibs/GyverNTP@^2.3.2
	gyverlibs/WiFiConnector@^1.0.6
	enjoyneering/AHT10@^1.1.0
	bblanchon/ArduinoJson@^7.4.3
	enjoyneering/LiquidCrystal_I2C@^1.4.0
	gyverlibs/GyverLCD@^1.0.5
