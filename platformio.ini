[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
upload_port = COM4
lib_deps = 
	gyverlibs/GTimer@^1.1.0
	gyverlibs/EncButton@^3.7.3
	gyverlibs/Settings@^1.3.12
	gyverlibs/GTL@^1.3.4
	gyverlibs/GyverDB@^1.3.2
	gyverlibs/StringUtils@^1.5.3
	gyverlibs/BSON@^2.2.3
	gyverlibs/Stamp@^1.4.2
	gyverlibs/Table@^1.3.3
	gyverlibs/StreamIO@^1.0.5
	gyverlibs/GyverNTP@^2.2.2
	gyverlibs/WiFiConnector@^1.0.4
	enjoyneering/AHT10@^1.1.0
	bblanchon/ArduinoJson@^7.4.2
	enjoyneering/LiquidCrystal_I2C@^1.4.0
